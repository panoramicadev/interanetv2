[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"

# El schema se aplica en runtime (bootstrapDatabase + runProductionMigrations,
# ambos en try/catch). NO usar db:push acá: es interactivo y bloquea el arranque.
[start]
cmd = "npm start"
